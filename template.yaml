AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Project TORCH  ESmart Faculty Navigator (CS333/CS361)
  SAM template defining all Lambda functions, the implicit API Gateway, and DynamoDB tables.

# ---------------------------------------------------------------------------
# Parameters  Eeverything that has to differ between one teammate's account and
# another's. Deploying with no overrides reproduces the shared setup exactly.
# ---------------------------------------------------------------------------
Parameters:
  LocationsTableName:
    Type: String
    Default: SmartFacultyLocations
    Description: >
      Name of the locations table. The default is the name issue #48 requires, so a
      plain `sam deploy` needs no override. Change it only when two people have to
      share one AWS account: two stacks cannot both own a fixed table name.
      Changing it on a live stack REPLACES the table  Ere-run the seed afterwards.
    AllowedPattern: "^[A-Za-z0-9_.-]{3,255}$"

  SchedulesTableName:
    Type: String
    Default: SmartFacultySchedules
    Description: >
      Name of the schedules table. Change it only when two people share one AWS
      account. Changing it on a live stack REPLACES the table.
    AllowedPattern: "^[A-Za-z0-9_.-]{3,255}$"

  PinsTableName:
    Type: String
    Default: SmartFacultyPins
    Description: >
      Name of the pins table storing personal timetables. Change it only when two people share
      one AWS account. Changing it on a live stack REPLACES the table.
    AllowedPattern: "^[A-Za-z0-9_.-]{3,255}$"

  ExistingLambdaRoleName:
    Type: String
    Default: LabRole
    Description: >
      An IAM role that already exists in the account, which both functions assume.
      AWS Academy Learner Lab cannot create IAM roles, so it reuses LabRole (the
      default). Deploy a normal AWS account with an empty string instead and this
      template creates its own least-privilege roles.

Conditions:
  UseExistingLambdaRole: !Not [!Equals [!Ref ExistingLambdaRoleName, ""]]
  CreateLambdaRoles: !Equals [!Ref ExistingLambdaRoleName, ""]

# ---------------------------------------------------------------------------
# Globals  Eapply to every Lambda function and the single implicit API Gateway
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
  Api:
    # gzip responses over 1 KB. GET /api/locations is ~135 KB of JSON, ~9 KB compressed,
    # and was spending about half a second of every page load just downloading.
    MinimumCompressionSize: 1024
    Cors:
      AllowMethods: "'GET,PUT,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'*'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt TorchUserPool.Arn
          Identity:
            Header: Authorization
      AddDefaultAuthorizerToCorsPreflight: false
    GatewayResponses:
      UNAUTHORIZED:
        ResponseParameters:
          Headers:
            Access-Control-Allow-Origin: "'*'"
            Access-Control-Allow-Headers: "'Content-Type,Authorization'"
            Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
      ACCESS_DENIED:
        ResponseParameters:
          Headers:
            Access-Control-Allow-Origin: "'*'"
            Access-Control-Allow-Headers: "'Content-Type,Authorization'"
            Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  SmartFacultyLocations:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref LocationsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: location_id
          AttributeType: S
      KeySchema:
        - AttributeName: location_id
          KeyType: HASH

  # Function roles, created only outside Learner Lab (ExistingLambdaRoleName = "").
  # They cannot be written as `Role: !If [..., arn, !Ref AWS::NoValue]`: the SAM
  # transform decides whether to synthesize a role by looking at whether the Role
  # key is present, long before CloudFormation resolves the intrinsic  Eso that
  # form silently skips role generation and then fails on a missing Role.
  GetLocationsRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScanLocationsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt SmartFacultyLocations.Arn

  UpdateLocationRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LocationsTableCrud
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt SmartFacultyLocations.Arn

  UpdateLocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/update-location/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt UpdateLocationRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultyLocations
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SmartFacultyLocations
      Events:
        UpdateLocation:
          Type: Api
          Properties:
            Path: /api/locations/{location_id}
            Method: put

  GetLocationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get-locations/
      Handler: index.handler
      # Lambda CPU scales with memory. At the 128 MB default, loading the AWS SDK and
      # serialising 131 records took 0.5 E.4 s before the first byte; this is still well
      # inside the free tier for one read on page load.
      MemorySize: 1024
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt GetLocationsRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultyLocations
      # Read-only by design: this endpoint may Scan the table and nothing else.
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt SmartFacultyLocations.Arn
      Events:
        GetLocations:
          # Type: Api with no RestApiId  Ejoins the single implicit API Gateway
          # whose CORS is configured in Globals. Never declare AWS::Serverless::Api.
          Type: Api
          Properties:
            Path: /api/locations
            Method: get
            Auth:
              Authorizer: NONE

  SmartFacultySchedules:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref SchedulesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: room_code
          AttributeType: S
        - AttributeName: schedule_slot
          AttributeType: S
      KeySchema:
        - AttributeName: room_code
          KeyType: HASH
        - AttributeName: schedule_slot
          KeyType: RANGE

  GetSchedulesRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ScanSchedulesOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt SmartFacultySchedules.Arn

  GetSchedulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get-schedules/
      Handler: index.handler
      MemorySize: 1024
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt GetSchedulesRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultySchedules
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt SmartFacultySchedules.Arn
      Events:
        GetSchedules:
          # Type: Api with no RestApiId  Ejoins the single implicit API Gateway.
          # Never declare AWS::Serverless::Api.
          Type: Api
          Properties:
            Path: /api/schedules
            Method: get
            Auth:
              Authorizer: NONE

  # ---------------------------------------------------------------------------
  # Admin write endpoints  Eissue #81 (admin-crud-panel).
  # DELETE /api/locations/{location_id}
  # POST   /api/schedules
  # PUT    /api/schedules/{room_code}/{schedule_slot}
  # DELETE /api/schedules/{room_code}/{schedule_slot}
  # ---------------------------------------------------------------------------

  DeleteLocationRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeleteLocationAndSchedules
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt SmartFacultyLocations.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt SmartFacultySchedules.Arn

  DeleteLocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/delete-location/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt DeleteLocationRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultyLocations
          SCHEDULES_TABLE_NAME: !Ref SmartFacultySchedules
      Events:
        DeleteLocation:
          Type: Api
          Properties:
            Path: /api/locations/{location_id}
            Method: delete

  CreateScheduleRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PutScheduleOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt SmartFacultySchedules.Arn

  CreateScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/create-schedule/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt CreateScheduleRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultySchedules
      Events:
        CreateSchedule:
          Type: Api
          Properties:
            Path: /api/schedules
            Method: post

  UpdateScheduleRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UpdateScheduleOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                    - dynamodb:UpdateItem
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:DeleteItem
                Resource: !GetAtt SmartFacultySchedules.Arn

  UpdateScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/update-schedule/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt UpdateScheduleRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultySchedules
      Events:
        UpdateSchedule:
          Type: Api
          Properties:
            Path: /api/schedules/{room_code}/{schedule_slot}
            Method: put

  DeleteScheduleRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeleteScheduleOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !GetAtt SmartFacultySchedules.Arn

  DeleteScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/delete-schedule/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt DeleteScheduleRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultySchedules
      Events:
        DeleteSchedule:
          Type: Api
          Properties:
            Path: /api/schedules/{room_code}/{schedule_slot}
            Method: delete

  # The website itself, so `sam deploy` builds the whole system and nobody has to
  # create a bucket by hand on the console (README: "No ClickOps").
  SiteBucket:
    Type: AWS::S3::Bucket
    # Disposable sandbox hosting. Retain would orphan a bucket whose name is
    # deterministic, so the next deploy of the same stack name would collide.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Globally unique without asking anyone for input. Keep stack names lowercase
      # and short: S3 forbids uppercase and caps the whole name at 63 characters.
      BucketName: !Sub "${AWS::StackName}-site-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        # Single-page app: an unknown path must return the app shell, not S3's XML 404.
        ErrorDocument: index.html
      OwnershipControls:
        # ACLs disabled  Ethe bucket policy below is the only thing granting access.
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        # These two must be false, or S3's secure-by-default behaviour rejects
        # SiteBucketPolicy and the stack rolls back.
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsiteObjects
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"

  # ---------------------------------------------------------------------------
  # Authentication — Amazon Cognito User Pool & Groups (issue #95)
  # ---------------------------------------------------------------------------
  TorchUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  TorchUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-client"
      UserPoolId: !Ref TorchUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  UserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      Description: General users with access to read and own schedules
      UserPoolId: !Ref TorchUserPool
      Precedence: 3

  StaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: staff
      Description: Staff members who can create and update schedules and rooms
      UserPoolId: !Ref TorchUserPool
      Precedence: 2

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      Description: Administrators who can manage all data including deletes
      UserPoolId: !Ref TorchUserPool
      Precedence: 1

  # ---------------------------------------------------------------------------
  # Admin User Management endpoints — issue #96 (rbac-admin-user-management).
  # GET    /api/admin/users
  # POST   /api/admin/users
  # PUT    /api/admin/users/{username}
  # DELETE /api/admin/users/{username}
  # ---------------------------------------------------------------------------

  ManageUsersRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ManageCognitoUsersOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:ListUsersInGroup
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminDeleteUser
                Resource: !GetAtt TorchUserPool.Arn

  ManageUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/manage-users/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt ManageUsersRole.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref TorchUserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminDeleteUser
              Resource: !GetAtt TorchUserPool.Arn
      Events:
        ListUsers:
          Type: Api
          Properties:
            Path: /api/admin/users
            Method: get
        CreateUser:
          Type: Api
          Properties:
            Path: /api/admin/users
            Method: post
        UpdateUser:
          Type: Api
          Properties:
            Path: /api/admin/users/{username}
            Method: put
        DeleteUser:
          Type: Api
          Properties:
            Path: /api/admin/users/{username}
            Method: delete

  # ---------------------------------------------------------------------------
  # My Schedule Pins endpoints — issue #97.
  # GET    /api/pins
  # POST   /api/pins
  # DELETE /api/pins/{room_code}/{schedule_slot}
  # ---------------------------------------------------------------------------

  SmartFacultyPins:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref PinsTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: pin_key
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: pin_key
          KeyType: RANGE

  GetPinsRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: QueryPinsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt SmartFacultyPins.Arn

  GetPinsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get-pins/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt GetPinsRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultyPins
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt SmartFacultyPins.Arn
      Events:
        GetPins:
          Type: Api
          Properties:
            Path: /api/pins
            Method: get

  CreatePinRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PutPinOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt SmartFacultyPins.Arn

  CreatePinFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/create-pin/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt CreatePinRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultyPins
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SmartFacultyPins.Arn
      Events:
        CreatePin:
          Type: Api
          Properties:
            Path: /api/pins
            Method: post

  DeletePinRole:
    Type: AWS::IAM::Role
    Condition: CreateLambdaRoles
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeletePinOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:DeleteItem
                Resource: !GetAtt SmartFacultyPins.Arn

  DeletePinFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/delete-pin/
      Handler: index.handler
      Role: !If
        - UseExistingLambdaRole
        - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ExistingLambdaRoleName}"
        - !GetAtt DeletePinRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultyPins
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt SmartFacultyPins.Arn
      Events:
        DeletePin:
          Type: Api
          Properties:
            Path: /api/pins/{room_code}/{schedule_slot}
            Method: delete


# ---------------------------------------------------------------------------
# Outputs — the scripts under scripts/ read these instead of hardcoding names,
# so every teammate's stack drives their own environment.
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: Implicit API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  SiteUrl:
    Description: S3 static website endpoint (http only — CloudFront is out of scope)
    Value: !GetAtt SiteBucket.WebsiteURL

  SiteBucketName:
    Description: Bucket the built frontend is synced into
    Value: !Ref SiteBucket

  LocationsTableName:
    Description: DynamoDB table the seed script and the API read
    Value: !Ref SmartFacultyLocations

  SchedulesTableName:
    Description: DynamoDB table the schedules seed script and the API read
    Value: !Ref SmartFacultySchedules

  PinsTableName:
    Description: DynamoDB table storing user-pinned schedule slots
    Value: !Ref SmartFacultyPins

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref TorchUserPool

  UserPoolClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref TorchUserPoolClient
